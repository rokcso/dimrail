# ██╔══██╗ ██║ ████╗ ████║ ██╔══██╗ ██╔══██╗ ██║ ██║
# ██║  ██║ ██║ ██╔████╔██║ ██████╔╝ ███████║ ██║ ██║
# ██║  ██║ ██║ ██║╚██╔╝██║ ██╔══██╗ ██╔══██║ ██║ ██║
# ██████╔╝ ██║ ██║ ╚═╝ ██║ ██║  ██║ ██║  ██║ ██║ ███████╗
# ╚═════╝  ╚═╝ ╚═╝     ╚═╝ ╚═╝  ╚═╝ ╚═╝  ╚═╝ ╚═╝ ╚══════╝

# ========== Basic Settings ==========
# Mixed port for HTTP and SOCKS5
mixed-port: 7890
# Allow LAN connections
allow-lan: false
bind-address: 127.0.0.1
# Run mode: rule/global/direct
mode: rule
# Log level: silent/info/warning/error/debug
log-level: info
# Enable IPv6
ipv6: false

# ========== External Controller ==========
# RESTful API for Web UI
external-controller: 127.0.0.1:9090
# Web UI directory (optional)
# external-ui: ./ui
# API secret (set your own password before exposing the controller to LAN)
# secret: 请设置你自己的密码，不要留空
secret: "dimrail-changeme"

# ========== GeoData Settings ==========
geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24

# ========== Performance Settings ==========
tcp-concurrent: true
unified-delay: true
# Browser fingerprint simulation (prevent fingerprint detection)
global-client-fingerprint: chrome
# Skip certificate verification for proxy servers
skip-cert-verify: false

# ========== TUN Mode (Transparent Proxy) ==========
tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53

# ========== Sniffer (Domain Sniffing) ==========
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"

# ========== DNS Configuration ==========
dns:
  enable: true
  prefer-h3: true
  ipv6: false
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  use-hosts: true
  # Respect rules for DNS queries (prevent DNS leak)
  respect-rules: true
  # Proxy domain resolution through proxy
  proxy-server-nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  fake-ip-filter:
    # ========== Local Network ==========
    - "*.lan"
    - "*.localdomain"
    - "*.example"
    - "*.invalid"
    - "*.localhost"
    - "*.test"
    - "*.local"
    - "*.home.arpa"
    - "*.corp"
    - "*.internal"

    # ========== GitHub (SSH connection needs real IP) ==========
    - "+.github.com"
    - "+.githubusercontent.com"
    - "+.githubapp.com"
    - "+.githubassets.com"
    - "github.com"
    - "*.github.com"

    # ========== AppsFlyer (QUIC connection needs real IP) ==========
    - "+.appsflyer.com"

    # ========== Time/NTP Services ==========
    - "+.pool.ntp.org"
    - "+.ntp.org.cn"
    - "+.time.edu.cn"
    - "+.time.apple.com"
    - "time1.cloud.tencent.com"
    - "time.windows.com"
    - "time.nist.gov"

    # ========== Network Connectivity Check ==========
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "captive.apple.com"
    - "detectportal.firefox.com"
    - "*.connectivitycheck.gstatic.com"
    - "clients3.google.com"
    - "clients4.google.com"

    # ========== Music Streaming ==========
    - "music.163.com"
    - "*.music.163.com"
    - "*.126.net"
    - "musicapi.taihe.com"
    - "music.taihe.com"
    - "songsearch.kugou.com"
    - "trackercdn.kugou.com"
    - "*.kuwo.cn"
    - "api-jooxtt.sanook.com"
    - "api.joox.com"
    - "joox.com"
    - "y.qq.com"
    - "*.y.qq.com"
    - "streamoc.music.tc.qq.com"
    - "mobileoc.music.tc.qq.com"
    - "isure.stream.qqmusic.qq.com"
    - "dl.stream.qqmusic.qq.com"
    - "aqqmusic.tc.qq.com"
    - "amobile.music.tc.qq.com"
    - "*.xiami.com"
    - "*.music.migu.cn"
    - "music.migu.cn"

    # ========== Gaming Platforms ==========
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "+.stun.*.*"
    - "xbox.*.microsoft.com"
    - "xnotify.xboxmojie.app"
    - "+.ipv6.microsoft.com"
    - "+.battlenet.com.cn"
    - "+.wotgame.cn"
    - "+.wggames.cn"
    - "+.wowsgame.cn"
    - "+.wargaming.net"
    - "+.pvp.net"
    - "*.square-enix.com"
    - "*.finalfantasyxiv.com"
    - "*.ffxiv.com"
    - "*.ff14.sdo.com"
    - "ff.dorado.sdo.com"

    # ========== Router Management ==========
    - "heartbeat.belkin.com"
    - "*.linksys.com"
    - "*.linksyssmartwifi.com"
    - "*.router.asus.com"
    - "*.hiwifi.com"
    - "*.miwifi.com"
    - "*.routerlogin.com"
    - "*.mymeraki.com"
    - "*.gl-inet.com"

    # ========== Apple Services ==========
    - "mesu.apple.com"
    - "swscan.apple.com"
    - "swquery.apple.com"
    - "swdownload.apple.com"
    - "swcdn.apple.com"
    - "swdist.apple.com"
    - "*.apple.com.edgesuite.net"
    - "push-apple.com.akadns.net"

    # ========== Tencent Related ==========
    - "localhost.ptlogin2.qq.com"
