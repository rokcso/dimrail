# ========== Rules ==========
# 注意：特定域名规则放在前面，通用规则放在后面
rules:
  # ===== 禁用 QUIC/HTTP3 (UDP:443) =====
  - DST-PORT,443,REJECT,udp

  # ===== 特定域名规则（优先级最高）=====
  - DOMAIN-SUFFIX,ahrefs.com,默认线路
  - DOMAIN-SUFFIX,hq1.appsflyer.com,默认线路
  - DOMAIN-SUFFIX,larksuite.com,DIRECT
  # ===== 个人域名直连 =====
  - DOMAIN-SUFFIX,rokcso.com,DIRECT
  - DOMAIN-SUFFIX,coryso.com,DIRECT

  # ===== 国内服务直连（补充规则）=====
  - RULE-SET,cn-direct,DIRECT

  # ===== 服务分类规则 =====
  - RULE-SET,ai-offshore,AI Service
  - RULE-SET,apple-cn,DIRECT
  - RULE-SET,apple-offshore,Apple
  - RULE-SET,github,GitHub
  - RULE-SET,web3,Web3
  - RULE-SET,telegram,Telegram
  - RULE-SET,spotify,Spotify
  - RULE-SET,youtube,YouTube

  # ===== 私有网络直连 =====
  - RULE-SET,lancidr,DIRECT

  # ===== 中国网站/IP 直连（放在最后，避免误匹配）=====
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT

  # ===== 兜底规则 =====
  - MATCH,默认线路
