# ========== Basic Settings ==========
# Mixed port for HTTP and SOCKS5
mixed-port: 7890
# Allow LAN connections
allow-lan: true
bind-address: "*"
# Run mode: rule/global/direct
mode: rule
# Log level: silent/info/warning/error/debug
log-level: info
# Enable IPv6
ipv6: false

# ========== External Controller ==========
# RESTful API for Web UI
external-controller: 0.0.0.0:9090
# Web UI directory (optional)
# external-ui: ./ui
# API secret (set your own password)
secret: ""

# ========== GeoData Settings ==========
geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24

# ========== Performance Settings ==========
tcp-concurrent: true
unified-delay: true

# ========== TUN Mode (Transparent Proxy) ==========
tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53

# ========== DNS Configuration ==========
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter:
    # ========== Local Network ==========
    - "*.lan"
    - "*.localdomain"
    - "*.example"
    - "*.invalid"
    - "*.localhost"
    - "*.test"
    - "*.local"
    - "*.home.arpa"
    - "*.corp"
    - "*.internal"

    # ========== Time/NTP Services ==========
    - "+.pool.ntp.org"
    - "+.ntp.org.cn"
    - "+.time.edu.cn"
    - "+.time.apple.com"
    - "time1.cloud.tencent.com"
    - "time.windows.com"
    - "time.nist.gov"

    # ========== Network Connectivity Check ==========
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "captive.apple.com"
    - "detectportal.firefox.com"
    - "*.connectivitycheck.gstatic.com"
    - "clients3.google.com"
    - "clients4.google.com"

    # ========== Music Streaming ==========
    - "music.163.com"
    - "*.music.163.com"
    - "*.126.net"
    - "musicapi.taihe.com"
    - "music.taihe.com"
    - "songsearch.kugou.com"
    - "trackercdn.kugou.com"
    - "*.kuwo.cn"
    - "api-jooxtt.sanook.com"
    - "api.joox.com"
    - "joox.com"
    - "y.qq.com"
    - "*.y.qq.com"
    - "streamoc.music.tc.qq.com"
    - "mobileoc.music.tc.qq.com"
    - "isure.stream.qqmusic.qq.com"
    - "dl.stream.qqmusic.qq.com"
    - "aqqmusic.tc.qq.com"
    - "amobile.music.tc.qq.com"
    - "*.xiami.com"
    - "*.music.migu.cn"
    - "music.migu.cn"

    # ========== Gaming Platforms ==========
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "+.stun.*.*"
    - "xbox.*.microsoft.com"
    - "xnotify.xboxmojie.app"
    - "+.ipv6.microsoft.com"
    - "+.battlenet.com.cn"
    - "+.wotgame.cn"
    - "+.wggames.cn"
    - "+.wowsgame.cn"
    - "+.wargaming.net"
    - "+.pvp.net"
    - "*.square-enix.com"
    - "*.finalfantasyxiv.com"
    - "*.ffxiv.com"
    - "*.ff14.sdo.com"
    - "ff.dorado.sdo.com"

    # ========== Router Management ==========
    - "heartbeat.belkin.com"
    - "*.linksys.com"
    - "*.linksyssmartwifi.com"
    - "*.router.asus.com"
    - "*.hiwifi.com"
    - "*.miwifi.com"
    - "*.routerlogin.com"
    - "*.mymeraki.com"
    - "*.gl-inet.com"

    # ========== Apple Services ==========
    - "mesu.apple.com"
    - "swscan.apple.com"
    - "swquery.apple.com"
    - "swdownload.apple.com"
    - "swcdn.apple.com"
    - "swdist.apple.com"
    - "*.apple.com.edgesuite.net"
    - "push-apple.com.akadns.net"

    # ========== Tencent Related ==========
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"

    # ========== Others ==========
    - "proxy.golang.org"
    - "lens.l.google.com"
    - "stun.l.google.com"
    - "*.mcdn.bilivideo.cn"
    - "+.media.dssott.com"

  default-nameserver:
    - 114.114.114.114
    - 119.29.29.29
    - 223.5.5.5
  nameserver:
    - tls://223.5.5.5:853
    - tls://223.6.6.6:853
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - tls://8.8.8.8:853
    - tls://1.1.1.1:853
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

# ========== Proxy Providers ==========
proxy-providers:
  ProxyProviderA:
    type: http
    url: https://rokcso.com/
    interval: 10800
    path: ./providers/ProxyProviderA.yaml
    health-check:
      enable: true
      interval: 300
      url: http://www.gstatic.com/generate_204
  ProxyProviderB:
    type: http
    url: https://rokcso.com/
    interval: 10800
    path: ./providers/ProxyProviderB.yaml
    health-check:
      enable: true
      interval: 300
      url: http://www.gstatic.com/generate_204
  ProxyProviderC:
    type: http
    url: https://rokcso.com/
    interval: 10800
    path: ./providers/ProxyProviderC.yaml
    health-check:
      enable: true
      interval: 300
      url: http://www.gstatic.com/generate_204

