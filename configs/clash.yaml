# ========== Basic Settings ==========
# 端口 / 局域网访问由 FlClash 客户端管理，模板不设置（需要时在 App 内调整）：
# mixed-port: 7890
# allow-lan: false
# bind-address: 127.0.0.1
# Run mode: rule/global/direct
mode: rule
# Log level: silent/info/warning/error/debug
log-level: info
# Enable IPv6
ipv6: true

# ========== External Controller ==========
# RESTful API 控制器由 FlClash 客户端接管，模板不设置；本地独立使用时可取消注释：
# external-controller: 127.0.0.1:9090
# secret: "请设置你自己的密码"

# ========== GeoData Settings ==========
geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24

# ========== Performance Settings ==========
tcp-concurrent: true
unified-delay: true
# Browser fingerprint simulation (prevent fingerprint detection)
global-client-fingerprint: chrome
# Skip certificate verification for proxy servers
skip-cert-verify: false

# Keep manual proxy-group choices after the client reloads this subscription.
profile:
  store-selected: true

# ========== TUN Mode ==========
# TUN 由 FlClash 客户端开关管理，模板不设置（需要时在 App 内开启）：
# tun:
#   enable: true
#   stack: system
#   auto-route: true
#   auto-detect-interface: true
#   dns-hijack:
#     - any:53
#     - tcp://any:53

# ========== Sniffer (Domain Sniffing) ==========
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"

# ========== DNS Configuration ==========
dns:
  enable: true
  ipv6: true
  # DNS 监听地址由 FlClash 客户端管理，模板不设置：
  # listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  use-hosts: true
  # Respect rules for DNS queries (prevent DNS leak)
  respect-rules: true
  # 节点服务器域名用国内可达的 DoH 解析（对齐机场配置）
  proxy-server-nameserver:
    - https://1.12.12.12/dns-query
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    - https://cloudflare-dns.com/dns-query
  fake-ip-filter:
    # ========== Local Network ==========
    - "*.lan"
    - "*.localdomain"
    - "*.example"
    - "*.invalid"
    - "*.localhost"
    - "*.test"
    - "*.local"
    - "*.home.arpa"
    - "*.corp"
    - "*.internal"

    # ========== GitHub (SSH connection needs real IP) ==========
    - "+.github.com"
    - "+.githubusercontent.com"
    - "+.githubapp.com"
    - "+.githubassets.com"
    - "github.com"
    - "*.github.com"

    # ========== AppsFlyer (QUIC connection needs real IP) ==========
    - "+.appsflyer.com"

    # ========== Time/NTP Services ==========
    - "+.pool.ntp.org"
    - "+.ntp.org.cn"
    - "+.time.edu.cn"
    - "+.time.apple.com"
    - "time1.cloud.tencent.com"
    - "time.windows.com"
    - "time.nist.gov"

    # ========== Network Connectivity Check ==========
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "captive.apple.com"
    - "detectportal.firefox.com"
    - "*.connectivitycheck.gstatic.com"
    - "clients3.google.com"
    - "clients4.google.com"

    # ========== Music Streaming ==========
    - "music.163.com"
    - "*.music.163.com"
    - "*.126.net"
    - "musicapi.taihe.com"
    - "music.taihe.com"
    - "songsearch.kugou.com"
    - "trackercdn.kugou.com"
    - "*.kuwo.cn"
    - "api-jooxtt.sanook.com"
    - "api.joox.com"
    - "joox.com"
    - "y.qq.com"
    - "*.y.qq.com"
    - "streamoc.music.tc.qq.com"
    - "mobileoc.music.tc.qq.com"
    - "isure.stream.qqmusic.qq.com"
    - "dl.stream.qqmusic.qq.com"
    - "aqqmusic.tc.qq.com"
    - "amobile.music.tc.qq.com"
    - "*.xiami.com"
    - "*.music.migu.cn"
    - "music.migu.cn"

    # ========== Gaming Platforms ==========
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "+.stun.*.*"
    - "xbox.*.microsoft.com"
    - "xnotify.xboxmojie.app"
    - "+.ipv6.microsoft.com"
    - "+.battlenet.com.cn"
    - "+.wotgame.cn"
    - "+.wggames.cn"
    - "+.wowsgame.cn"
    - "+.wargaming.net"
    - "+.pvp.net"
    - "*.square-enix.com"
    - "*.finalfantasyxiv.com"
    - "*.ffxiv.com"
    - "*.ff14.sdo.com"
    - "ff.dorado.sdo.com"

    # ========== Router Management ==========
    - "heartbeat.belkin.com"
    - "*.linksys.com"
    - "*.linksyssmartwifi.com"
    - "*.router.asus.com"
    - "*.hiwifi.com"
    - "*.miwifi.com"
    - "*.routerlogin.com"
    - "*.mymeraki.com"
    - "*.gl-inet.com"

    # ========== Apple Services ==========
    - "mesu.apple.com"
    - "swscan.apple.com"
    - "swquery.apple.com"
    - "swdownload.apple.com"
    - "swcdn.apple.com"
    - "swdist.apple.com"
    - "*.apple.com.edgesuite.net"
    - "push-apple.com.akadns.net"

    # ========== Tencent Related ==========
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"

    # ========== Others ==========
    - "proxy.golang.org"
    - "lens.l.google.com"
    - "stun.l.google.com"
    - "*.mcdn.bilivideo.cn"
    - "+.media.dssott.com"

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
    - tls://8.8.8.8:853
    - tls://1.1.1.1:853
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - cn
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
  # DNS 分流策略
  nameserver-policy:
    # ===== AI 服务使用 Cloudflare DNS =====
    "+.openai.com": https://cloudflare-dns.com/dns-query
    "+.chatgpt.com": https://cloudflare-dns.com/dns-query
    "+.anthropic.com": https://cloudflare-dns.com/dns-query
    "+.claude.ai": https://cloudflare-dns.com/dns-query
    "+.perplexity.ai": https://cloudflare-dns.com/dns-query
    "+.gemini.google.com": https://cloudflare-dns.com/dns-query
    # ===== Google 服务 =====
    "+.google.com": https://dns.google/dns-query
    "+.googleapis.com": https://dns.google/dns-query
    "+.gstatic.com": https://dns.google/dns-query
    "+.ggpht.com": https://dns.google/dns-query
    "+.youtube.com": https://dns.google/dns-query
    "+.ytimg.com": https://dns.google/dns-query
    "+.googlevideo.com": https://dns.google/dns-query
    # ===== GitHub =====
    "+.github.com": https://dns.google/dns-query
    "+.githubusercontent.com": https://dns.google/dns-query
    "+.githubassets.com": https://dns.google/dns-query
    # ===== Telegram =====
    "+.telegram.org": https://cloudflare-dns.com/dns-query
    "+.t.me": https://cloudflare-dns.com/dns-query
    # ===== 国内域名使用国内 DNS =====
    "+.cn": https://dns.alidns.com/dns-query
    "+.bilibili.com": https://dns.alidns.com/dns-query
    "+.douyin.com": https://dns.alidns.com/dns-query
    "+.ixigua.com": https://dns.alidns.com/dns-query
    "+.toutiao.com": https://dns.alidns.com/dns-query

# ========== Proxy Providers ==========
# 通过 Worker 部署时，此段会在生成/请求时自动注入真实订阅源，这里仅作占位。
# 本地独立使用（不经过 Worker）时，把 url 替换为你的机场订阅链接即可。
proxy-providers:
  ProxyProviderA:
    type: http
    url: https://example.com/sub
    interval: 10800
    path: ./providers/ProxyProviderA.yaml
    health-check:
      enable: true
      interval: 300
      url: http://www.gstatic.com/generate_204

# ========== Proxy Groups ==========
proxy-groups:
  - name: 默认线路
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Proxy.png
    type: select
    use: [ProxyProviderA]
    proxies:
      - 自动选择
      - HK 香港
      - SG 新加坡
      - JP 日本
      - US 美国
      - 其他地区
      - DIRECT

  - name: AI Service
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/AI.png
    type: select
    use: [ProxyProviderA]
    proxies:
      - US 美国
      - SG 新加坡
      - JP 日本
      - HK 香港
      - 其他地区

  - name: 流媒体
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Media.png
    type: select
    use: [ProxyProviderA]
    proxies:
      - 流媒体专用
      - HK 香港
      - SG 新加坡
      - JP 日本
      - US 美国
      - 其他地区

  # ========== Region-based Groups ==========
  - name: HK 香港
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Hong_Kong.png
    type: select
    use: [ProxyProviderA]
    filter: "(?i)(澳门|🇲🇴|Macau|Macao|香港|🇭🇰|Hong Kong|HK|HKG)"
    proxies:
      - HK-Auto
  - name: HK-Auto
    hidden: true
    type: url-test
    interval: 600
    timeout: 5000
    lazy: true
    tolerance: 100
    use: [ProxyProviderA]
    filter: "(?i)(澳门|🇲🇴|Macau|Macao|香港|🇭🇰|Hong Kong|HK|HKG)"

  - name: SG 新加坡
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Singapore.png
    type: select
    use: [ProxyProviderA]
    filter: "新加坡|坡|狮城|🇸🇬|SG|(?i)Singapore"
    proxies:
      - SG-Auto
  - name: SG-Auto
    hidden: true
    type: url-test
    interval: 600
    timeout: 5000
    lazy: true
    tolerance: 100
    use: [ProxyProviderA]
    filter: "新加坡|坡|狮城|🇸🇬|SG|(?i)Singapore"

  - name: JP 日本
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Japan.png
    type: select
    use: [ProxyProviderA]
    filter: "(?i)(日本|🇯🇵|东京|大阪|JP|Japan|Tokyo|Osaka)"
    proxies:
      - JP-Auto
  - name: JP-Auto
    hidden: true
    type: url-test
    interval: 600
    timeout: 5000
    lazy: true
    tolerance: 100
    use: [ProxyProviderA]
    filter: "(?i)(日本|🇯🇵|东京|大阪|JP|Japan|Tokyo|Osaka)"

  - name: US 美国
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/United_States.png
    type: select
    use: [ProxyProviderA]
    filter: "(?i)(美国|🇺🇸|US|USA|United States|America|Los Angeles|New York|San Francisco|Seattle|Chicago|美西|美东|西部|东部)"
    proxies:
      - US-Auto
  - name: US-Auto
    hidden: true
    type: url-test
    interval: 600
    timeout: 5000
    lazy: true
    tolerance: 100
    use: [ProxyProviderA]
    filter: "(?i)(美国|🇺🇸|US|USA|United States|America|Los Angeles|New York|San Francisco|Seattle|Chicago|美西|美东|西部|东部)"

  - name: 流媒体专用
    hidden: true
    type: url-test
    interval: 600
    timeout: 5000
    lazy: true
    tolerance: 100
    use: [ProxyProviderA]
    filter: "(?i)(IPLC|IEPL|专线|游戏|Game|Media|流媒体|Netflix|Disney|HBO|Prime|Video|NF|原生|Native|解锁|Unlock|Premium|Elite|Pro)"

  - name: 其他地区
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/World_Map.png
    type: select
    use: [ProxyProviderA]
    filter: "(?i)^(?!.*(?:🇭🇰|香港|HK|HKG|Hong Kong|🇲🇴|澳门|Macau|Macao|🇯🇵|日本|JP|Japan|Tokyo|Osaka|🇺🇸|美国|US|USA|United States|America|Los Angeles|New York|San Francisco|Seattle|Chicago|美西|美东|西部|东部|🇸🇬|新加坡|SG|Singapore|狮城|坡|🇨🇳|中国|CN|China|\\.com\\b|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|(?:\\b(?:USE|USED|TOTAL|Traffic|Expire|EMAIL|Panel|Channel|Author)\\b)|(?:\\d{4}-\\d{2}-\\d{2}|\\d+G))).*$"
    proxies:
      - 其他-Auto
  - name: 其他-Auto
    hidden: true
    type: url-test
    interval: 600
    timeout: 5000
    lazy: true
    tolerance: 100
    use: [ProxyProviderA]
    filter: "(?i)^(?!.*(?:🇭🇰|香港|HK|HKG|Hong Kong|🇲🇴|澳门|Macau|Macao|🇯🇵|日本|JP|Japan|Tokyo|Osaka|🇺🇸|美国|US|USA|United States|America|Los Angeles|New York|San Francisco|Seattle|Chicago|美西|美东|西部|东部|🇸🇬|新加坡|SG|Singapore|狮城|坡|🇨🇳|中国|CN|China|\\.com\\b|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|(?:\\b(?:USE|USED|TOTAL|Traffic|Expire|EMAIL|Panel|Channel|Author)\\b)|(?:\\d{4}-\\d{2}-\\d{2}|\\d+G))).*$"

  # ========== Auto-select Groups ==========
  - name: 自动选择
    hidden: true
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Auto.png
    type: url-test
    interval: 600
    timeout: 5000
    lazy: true
    tolerance: 100
    use: [ProxyProviderA]
    filter: "^(?!.*(?:群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|\\.com\\b|(?:\\b(?:USE|USED|TOTAL|Traffic|Expire|EMAIL|Panel|Channel|Author)\\b)|(?:\\d{4}-\\d{2}-\\d{2}|\\d+G))).*$"

# ========== Rule Providers ==========
# 规则集来源策略：优先使用第三方维护的高质量规则集，第三方没有的才自维护。
#   - Loyalsoldier/clash-rules（~27.9k stars，Clash 生态标准）：国内直连补充、局域网
#   - MetaCubeX/meta-rules-dat（每日更新，v2fly 数据源）：Apple/GitHub/AI/流媒体/Telegram 等分类
#   - 自维护（rules/*.yaml）：仅第三方没有的合集（AI 长尾、Web3）
# 注意：behavior: domain 下裸域名=精确匹配，"+." 前缀=后缀匹配（含子域名）
rule-providers:
  # ===== 第三方：Loyalsoldier/clash-rules =====
  direct:
    type: http
    behavior: domain
    url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt
    path: ./rules/direct.txt
    interval: 86400
  lancidr:
    type: http
    behavior: ipcidr
    url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt
    path: ./rules/lancidr.txt
    interval: 86400

  # ===== 第三方：MetaCubeX/meta-rules-dat（format: text）=====
  apple-cn:
    type: http
    behavior: domain
    format: text
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/apple-cn.list
    path: ./rules/apple-cn.list
    interval: 86400
  openai:
    type: http
    behavior: domain
    format: text
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/openai.list
    path: ./rules/openai.list
    interval: 86400
  anthropic:
    type: http
    behavior: domain
    format: text
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/anthropic.list
    path: ./rules/anthropic.list
    interval: 86400
  spotify:
    type: http
    behavior: domain
    format: text
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/spotify.list
    path: ./rules/spotify.list
    interval: 86400
  youtube:
    type: http
    behavior: domain
    format: text
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/youtube.list
    path: ./rules/youtube.list
    interval: 86400
  netflix:
    type: http
    behavior: domain
    format: text
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/netflix.list
    path: ./rules/netflix.list
    interval: 86400
  disney:
    type: http
    behavior: domain
    format: text
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/disney.list
    path: ./rules/disney.list
    interval: 86400
  primevideo:
    type: http
    behavior: domain
    format: text
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/primevideo.list
    path: ./rules/primevideo.list
    interval: 86400
  hbo:
    type: http
    behavior: domain
    format: text
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/hbo.list
    path: ./rules/hbo.list
    interval: 86400

  # ===== 自维护（第三方没有对应合集）=====
  ai-offshore:
    type: http
    behavior: domain
    format: yaml
    url: https://fastly.jsdelivr.net/gh/rokcso/dimrail@main/rules/ai-offshore.yaml
    path: ./rules/ai-offshore.yaml
    interval: 604800

# ========== Rules ==========
# 注意：特定域名规则放在前面，通用规则放在后面
rules:
  # ===== 特定域名规则（优先级最高）=====
  - DOMAIN-SUFFIX,ahrefs.com,默认线路
  - DOMAIN-SUFFIX,hq1.appsflyer.com,默认线路
  - DOMAIN-SUFFIX,larksuite.com,DIRECT
  # ===== 个人域名直连 =====
  - DOMAIN-SUFFIX,rokcso.com,DIRECT
  - DOMAIN-SUFFIX,coryso.com,DIRECT

  # ===== 服务分类规则（第三方规则集）=====
  - RULE-SET,openai,AI Service
  - RULE-SET,anthropic,AI Service
  - RULE-SET,ai-offshore,AI Service # 长尾 AI（第三方无合集）
  - RULE-SET,apple-cn,DIRECT # Apple 中国直连（须在 apple 之前）
  - RULE-SET,spotify,流媒体
  - RULE-SET,youtube,流媒体
  - RULE-SET,netflix,流媒体
  - RULE-SET,disney,流媒体
  - RULE-SET,primevideo,流媒体
  - RULE-SET,hbo,流媒体

  # ===== 国内服务直连（Loyalsoldier direct 补充）=====
  - RULE-SET,direct,DIRECT

  # ===== 私有网络直连 =====
  - RULE-SET,lancidr,DIRECT

  # ===== 中国网站/IP 直连（放在最后，避免误匹配）=====
  - GEOSITE,cn,DIRECT
