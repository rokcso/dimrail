    # ========== Others ==========
    - "proxy.golang.org"
    - "lens.l.google.com"
    - "stun.l.google.com"
    - "*.mcdn.bilivideo.cn"
    - "+.media.dssott.com"

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
    - tls://8.8.8.8:853
    - tls://1.1.1.1:853
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - cn
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
  # DNS 分流策略
  nameserver-policy:
    # ===== AI 服务使用 Cloudflare DNS =====
    "+.openai.com": https://cloudflare-dns.com/dns-query
    "+.chatgpt.com": https://cloudflare-dns.com/dns-query
    "+.anthropic.com": https://cloudflare-dns.com/dns-query
